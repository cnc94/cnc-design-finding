<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Design Finding</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f6f8;color:#18202a}
header{background:#111827;color:#fff;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800}.logo span{color:#38bdf8}
header button{border:0;border-radius:9px;padding:11px 16px;background:#38bdf8;color:#062033;font-weight:700;cursor:pointer}
.hero{padding:55px 5%;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}.hero h1{font-size:42px;margin:0 0 10px}.hero p{color:#cbd5e1;font-size:17px}
.wrap{width:90%;max-width:1200px;margin:28px auto}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
input,select{padding:13px;border:1px solid #d1d5db;border-radius:9px;background:#fff;font-size:15px}
#search{flex:1;min-width:220px}.btn{background:#111827;color:white;border:0;border-radius:9px;padding:13px 18px;cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #00000012;border:1px solid #e5e7eb}
.preview{height:190px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.noimg{font-weight:800;color:#64748b}
.cardbody{padding:15px}.card h3{margin:0 0 8px}.meta{font-size:13px;color:#64748b;margin-bottom:12px}.actions{display:flex;gap:8px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;padding:9px;border-radius:8px;border:0;cursor:pointer;font-weight:700}.download{background:#e0f2fe;color:#0369a1}.delete{background:#fee2e2;color:#b91c1c}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:520px;border-radius:16px;padding:24px}.box h2{margin-top:0}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%}.close{float:right;background:#eee;border:0;border-radius:8px;padding:7px 11px;cursor:pointer}.empty{text-align:center;padding:50px;color:#64748b;grid-column:1/-1}
footer{text-align:center;padding:35px;color:#64748b}
@media(max-width:600px){.hero h1{font-size:31px}header{padding:17px 4%}.logo{font-size:20px}}
</style>
</head>
<body>
<header><div class="logo">CNC <span>Design Finding</span></div><button onclick="openModal()">+ Upload Design</button></header>
<section class="hero"><div class="wrap"><h1>আপনার CNC Design খুঁজুন</h1><p>DXF, RLF ও STL ফাইলের সাথে JPG/PNG Preview সংরক্ষণ করুন।</p></div></section>
<main class="wrap">
<div class="tools"><input id="search" placeholder="ডিজাইনের নাম লিখে Search করুন..." oninput="render()"><select id="filter" onchange="render()"><option value="">সব ফাইল</option><option>DXF</option><option>RLF</option><option>STL</option></select></div>
<div id="grid" class="grid"></div>
</main>
<footer>CNC Design Finding — CNC Design Library</footer>

<div id="modal" class="modal"><div class="box">
<button class="close" onclick="closeModal()">✕</button><h2>নতুন CNC Design Upload</h2>
<form id="form">
<div class="field"><label>ডিজাইনের নাম</label><input id="name" required placeholder="যেমন: Modern Bed Design"></div>
<div class="field"><label>ক্যাটাগরি</label><input id="cat" placeholder="Bed / Door / Table / Chair"></div>
<div class="field"><label>CNC File (DXF / RLF / STL)</label><input id="file" type="file" accept=".dxf,.rlf,.stl" required></div>
<div class="field"><label>Design Image (JPG / PNG)</label><input id="image" type="file" accept=".jpg,.jpeg,.png" required></div>
<button class="btn" style="width:100%">Upload Design</button>
</form>
</div></div>

<script>
const KEY="cnc_designs_demo";
let designs=JSON.parse(localStorage.getItem(KEY)||"[]");
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function render(){
 const q=document.getElementById("search").value.toLowerCase(), f=document.getElementById("filter").value;
 const list=designs.filter(d=>(!q||d.name.toLowerCase().includes(q)||d.cat.toLowerCase().includes(q))&&(!f||d.ext===f));
 const grid=document.getElementById("grid");
 if(!list.length){grid.innerHTML='<div class="empty">কোনো ডিজাইন পাওয়া যায়নি। প্রথম ডিজাইনটি Upload করুন।</div>';return}
 grid.innerHTML=list.map((d,i)=>`<article class="card"><div class="preview">${d.image?`<img src="${d.image}">`:'<div class="noimg">NO PREVIEW</div>'}</div><div class="cardbody"><h3>${esc(d.name)}</h3><div class="meta">${esc(d.ext)} • ${esc(d.cat||"Uncategorized")}</div><div class="actions"><a class="download" href="${d.file}" download="${esc(d.fileName)}">Download</a><button class="delete" onclick="removeDesign(${i})">Delete</button></div></div></article>`).join("");
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function removeDesign(i){if(confirm("এই ডিজাইনটি মুছে ফেলবেন?")){designs.splice(i,1);save();render()}}
function save(){localStorage.setItem(KEY,JSON.stringify(designs))}
document.getElementById("form").onsubmit=async e=>{
 e.preventDefault();
 const file=document.getElementById("file").files[0], image=document.getElementById("image").files[0];
 const ext=file.name.split(".").pop().toUpperCase();
 const read=f=>new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
 const d={name:document.getElementById("name").value,cat:document.getElementById("cat").value,ext,fileName:file.name,file:await read(file),image:await read(image)};
 designs.unshift(d);save();e.target.reset();closeModal();render();
 alert("Design সফলভাবে Upload হয়েছে!");
};
render();
</script>
</body></html>
